{% extends 'layout_cliente.html' %}

{% block titulo %}
Realizar Pedido
{% endblock %}

{% block encabezado %}
🛒 Realizar Pedido
{% endblock %}

{% block contenido %}

<div class="grafica-box">

    <h2>Nuevo Pedido</h2>

    <form action="/guardar_pedido"
          method="POST"
          class="inventario-form">

        <div id="productos-container">

            <div class="producto-item">

                <select name="producto[]" required>

                    <option value="">
                        Seleccione producto
                    </option>

                    {% for p in productos %}

                    <option value="{{ p.id_producto }}">

                        {{ p.nombre }}
                        -
                        ${{ p.precio }}
                        (Stock: {{ p.stock }})

                    </option>

                    {% endfor %}

                </select>

                <input type="number"
                       name="cantidad[]"
                       min="1"
                       placeholder="Cantidad"
                       required>

            </div>

        </div>

        <button type="button"
                onclick="agregarProducto()">

            ➕ Agregar producto

        </button>

        <button type="submit">

            ✅ Enviar Pedido

        </button>

    </form>

</div>

<script>

function agregarProducto() {

    let container =
        document.getElementById("productos-container");

    let nuevo =
        container.firstElementChild.cloneNode(true);

    nuevo.querySelector("select").value = "";

    nuevo.querySelector("input").value = "";

    container.appendChild(nuevo);
}

</script>

{% endblock %}
