<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header>
        <h1>✏️ Editar producto</h1>
    </header>

    <form action="{{ url_for('actualizar_producto', id_producto=producto.id_producto) }}" method="post">

        <input type="text" name="nombre" value="{{ producto.nombre }}" required>

        <input type="text" name="descripcion" value="{{ producto.descripcion or '' }}">

        <input type="number" step="0.01" name="precio" 
               value="{{ '{:.2f}'.format(producto.precio) }}" required>

        <input type="number" name="stock" value="{{ producto.stock }}" required>

        <button type="submit">💾 Guardar cambios</button>
    </form>

    <div class="volver">
        <a href="{{ url_for('productos') }}">🔙 Volver a productos</a>
    </div>
</body>
</html>
