<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Norte salud nv</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header>
        <h1>🏥 Norte salud nv</h1>
        <p>Bienvenido(a), selecciona una opción para comenzar</p>
    </header>

    <main style="text-align:center; margin-top: 60px;">
        <div style="display: flex; justify-content: center; gap: 40px; flex-wrap: wrap;">

            <!-- Productos -->
            <a href="{{ url_for('productos') }}" style="
                background-color:#00693e;
                color:white;
                padding:20px 30px;
                border-radius:10px;
                text-decoration:none;
                font-size:18px;
                box-shadow:0 2px 5px rgba(0,0,0,0.2);
                transition: background 0.3s;">
                💊 Productos
            </a>

            <!-- Ventas (ya activado) -->
            <a href="{{ url_for('ventas') }}" style="
                background-color:#ffd700;
                color:#013220;
                padding:20px 30px;
                border-radius:10px;
                text-decoration:none;
                font-size:18px;
                box-shadow:0 2px 5px rgba(0,0,0,0.2);
                transition: background 0.3s;">
                🧾 Ventas
            </a>

            <!-- Clientes (puedo activarlo si quieres) -->
            <a href="#" style="
                background-color:#ffffff;
                color:#00693e;
                border:2px solid #00693e;
                padding:20px 30px;
                border-radius:10px;
                text-decoration:none;
                font-size:18px;
                box-shadow:0 2px 5px rgba(0,0,0,0.2);
                transition: background 0.3s;">
                👥 Clientes (próximamente)
            </a>

            <!-- Proveedores -->
            <a href="{{ url_for('proveedores') }}" style="
                background-color:#013220;
                color:white;
                padding:20px 30px;
                border-radius:10px;
                text-decoration:none;
                font-size:18px;
                box-shadow:0 2px 5px rgba(0,0,0,0.2);
                transition: background 0.3s;">
                🚚 Proveedores
            </a>

        </div>
    </main>

    <footer style="text-align:center; margin-top:80px; padding:20px; background:#013220; color:white;">
        <p>Desarrollado por angel vega © 2025</p>
    </footer>
</body>
</html>
