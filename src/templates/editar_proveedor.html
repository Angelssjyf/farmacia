{% extends 'layout.html' %}

{% block titulo %}
Editar Proveedor
{% endblock %}

{% block encabezado %}
✏️ Editar Proveedor
{% endblock %}

{% block contenido %}

<div class="grafica-box">

    <h2>
        Actualizar información del proveedor
    </h2>

    <form action="{{ url_for(
        'actualizar_proveedor',
        id=proveedor.id_proveedor
    ) }}"
    method="POST"
    class="inventario-form">

        <input type="text"
               name="nombre"
               value="{{ proveedor.nombre }}"
               placeholder="Nombre del proveedor"
               required>

        <input type="text"
               name="telefono"
               value="{{ proveedor.telefono or '' }}"
               placeholder="Teléfono">

        <input type="email"
               name="correo"
               value="{{ proveedor.correo or '' }}"
               placeholder="Correo electrónico">

        <input type="text"
               name="direccion"
               value="{{ proveedor.direccion or '' }}"
               placeholder="Dirección">

        <button type="submit"
                class="btn-enviar">

            💾 Guardar Cambios

        </button>

    </form>

    <div class="volver-box">

        <a href="{{ url_for('proveedores') }}"
           class="btn-volver">

            ⬅ Volver a proveedores

        </a>

    </div>

</div>

{% endblock %}
