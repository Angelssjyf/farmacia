<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <div class="login-box">
        <h2>Registrar nuevo usuario</h2>

        <form method="POST">

            <input 
                type="text" 
                name="usuario" 
                placeholder="Nombre de usuario" 
                required
            >

            <input 
                type="password" 
                name="contrasena" 
                placeholder="Contraseña" 
                required
            >

            <select name="rol" required>
                <option value="">Selecciona un rol</option>
                
                <option value="superadmin">
                    Super Administrador
                </option>

                <option value="admin">
                    Administrador
                </option>

                <option value="cliente">
                    Cliente
                </option>
            </select>

            <button type="submit">
                Registrar
            </button>
        </form>

        <p>
            <a href="{{ url_for('panel_superadmin') }}" class="btn-volver">
               ⬅ Volver al panel super admin
            </a>
        </p>
    </div>

</body>
</html>
