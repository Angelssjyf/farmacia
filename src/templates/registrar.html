{% extends 'layout.html' %}

{% block titulo %}
Registrar Usuario
{% endblock %}

{% block encabezado %}
👥 Gestión de Usuarios
{% endblock %}

{% block contenido %}

<section class="form-contenedor">

    <form method="POST">

        <input type="text"
               name="usuario"
               placeholder="Nombre de usuario"
               required>

        <input type="password"
               name="contrasena"
               placeholder="Contraseña"
               required>

        <select name="rol" required>

            <option value="">
                Selecciona un rol
            </option>

            <option value="superadmin">
                👑 Super Administrador
            </option>

            <option value="admin">
                🛠 Administrador
            </option>

            <option value="cliente">
                👤 Cliente
            </option>

        </select>

        <button type="submit">

            ➕ Registrar Usuario

        </button>

    </form>

</section>

{% endblock %}
