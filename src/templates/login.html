<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGV FARMA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body class="login-body">

<div class="login-container">

    <!-- IZQUIERDA -->
    <div class="login-left">

        <div class="logo-area">

            <img src="{{ url_for('static', filename='img/logo.png') }}"
                 alt="Logo"
                 class="logo-login">

            <h1>
                SGV <span>FARMA</span>
            </h1>

            <p>
                Sistema de Gestión Farmacéutica
            </p>

        </div>

    </div>

    <!-- DERECHA -->
    <div class="login-right">

        <form action="{{ url_for('login') }}"
              method="POST"
              class="login-form">

            <h2>
                Iniciar <span>Sesión</span>
            </h2>

            <div class="linea"></div>

            {% if error %}
                <div class="error">
                    ❌ {{ error }}
                </div>
            {% endif %}

            <div class="input-box">

                <input type="text"
                       name="usuario"
                       placeholder="Usuario"
                       required>

            </div>

            <div class="input-box">

                <input type="password"
                       name="password"
                       placeholder="Contraseña"
                       required>

            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</div>

</body>
</html>
